<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>画像表示実験</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">
        <h2>画像をグリッドで分割してアニメーション</h2>
        <img class="grid-image grid-animation"
            src="https://images.unsplash.com/photo-1506905925346-21bda4d32df4?w=1200&h=800&fit=crop" alt="Sample Image">

        <h2>画像に白を乗せて白がグリッドで消えていくアニメーション</h2>
        <img class="mask-image mask-animation"
            src="https://images.unsplash.com/photo-1506905925346-21bda4d32df4?w=1200&h=800&fit=crop" alt="Sample Image">


    </div>
    <script src="grid-animation.js"></script>
    <script src="mask-animation.js"></script>
</body>

</html>
