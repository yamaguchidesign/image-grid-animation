<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>画像表示実験</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">
        <h1>画像表示実験</h1>
        <div class="grid-container" id="gridContainer">
        </div>

        <h2>マスクアニメーション</h2>
        <div class="mask-container" id="maskContainer">
            <div class="image-layer">
                <img src="https://images.unsplash.com/photo-1506905925346-21bda4d32df4?w=1200&h=800&fit=crop"
                    alt="Sample Image">
            </div>
            <div class="mask-layer" id="maskLayer">
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>

</html>
